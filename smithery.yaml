# Smithery Configuration for T-Zero PC-Fixer & Codebase Doctor MCP Server
# Enables 1-click installation via Smithery.ai for Cursor, Claude Desktop, Windsurf, and Antigravity
runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties: {}
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: [
        "--from",
        "git+https://github.com/toprakahmetaydogmus/tzero-pc-fixer",
        "pc-fixer-mcp"
      ]
    })
